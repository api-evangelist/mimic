name: Mimic
description: >-
  Mimic is an enterprise cybersecurity company building ransomware and
  AI-threat defense based on "Known-Good Enforcement" at the kernel level.
  Its SaaS platform models a system's authorized state and blocks unauthorized
  modifications, detecting ransomware in fractions of a second to deflect
  attacks before they can encrypt data or damage infrastructure, and providing
  rapid-recovery technology that restores in seconds-to-minutes rather than
  days. Product lines include Ransomware Defense, AI Shield (Guard/Patch/Trace)
  and Agentic AI Governance. Founded in 2023 and headquartered in Palo Alto,
  California, Mimic raised a $27M seed and a $50M Series A led by GV (Google
  Ventures) and Menlo Ventures, with Ballistic Ventures, Team8, Wing Venture
  Capital and Shield Capital participating; former Mandiant CEO Kevin Mandia
  joined its board. The platform is enterprise/government-facing (sold via
  demo, no public developer API) and is aligned with GDPR, SOC 1 & 2, IL4/IL5
  and holds FedRAMP Ready status. Added to the API Evangelist network as a
  VC-portfolio lead.
